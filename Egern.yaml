# ShiYi 个人配置和策略 | Egern
# 本配置为 ShiYi 个人整理与分享，仅供参考，请勿用于商业用途。
# 参考 ClashConnectRules/Egern，按 Egern 规则顺序分流，并保留个人策略选择。
# 使用前替换订阅 URL；自建节点需在 proxies 中添加，再在自建节点组中引用；
# 如需参与自动测速和故障转移，也须将节点名称加入对应策略组。

ipv6: false
allow_external_connections: false
real_ip_domains:
  - '*.stun.*.*'
  - '*.stun.*.*.*'
  - '*.stun.*.*.*.*'
  - '*.stun.*.*.*.*.*'
  - '*.n.n.srv.nintendo.net'
  - '*.stun.playstation.net'
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  - '*.msftncsi.com'
  - '*.msftconnecttest.com'
  - '*.lan'
  - '*.local'
hijack_dns:
  - 8.8.8.8:53
  - 8.8.4.4:53
vif_excluded_routes:
  - 224.0.0.0/4
  - ff02::fb/128
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
dns:
  bootstrap:
    - system
    - 223.5.5.5
  forward:
    - domain_wildcard:
        match: '*'
        value: bootstrap

# 自建节点：在此填写你的自建代理，例如：
# proxies:
#   - anytls:
#       name: Example
#       server: example.com
#       port: 443
#       password: YOUR_PASSWORD
#       sni: example.com
#       udp_relay: true
#       skip_tls_verify: false
proxies: []

policy_groups:
  # ==================== 核心入口（对齐 Surge：节点选择 / 自动选择 / 自建节点 / 订阅节点）====================
  - select:
      name: 订阅节点
      urls:
        - https://YOUR_SUBSCRIPTION_URL
        # 多订阅取消下一行注释：
        # - https://YOUR_SUBSCRIPTION_URL_2
      update_interval: 86400
      filter: '(?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|回国|游戏|维护|game|expire|traffic)).+'
      icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png

  - select:
      name: 自建节点
      policies:
        - DIRECT
        # 在上方添加自建节点名称，例如：
        # - 🇺🇸Example
      icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Daily.png

  - auto_test:
      name: 自动选择
      policies:
        - 订阅节点
      flatten: true
      interval: 600
      tolerance: 50
      timeout: 5
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

  - fallback:
      name: 兜底后备策略
      policies:
        - 订阅节点
      flatten: true
      interval: 600
      timeout: 5
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

  - select:
      name: 全球手动策略
      policies:
        - 订阅节点
      flatten: true
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

  - select:
      name: 节点选择
      policies:
        - 自动选择
        - 兜底后备策略
        - 自建节点
        - 订阅节点
        - 全球手动策略
        - DIRECT
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Proxy.png

  # ==================== 业务策略组 ====================
  - select:
      name: AI
      policies: &svc
        - 节点选择
        - 自动选择
        - 🇭🇰 香港
        - 🇯🇵 日本
        - 🇸🇬 新加坡
        - 🇺🇸 美国
        - 🇩🇪 德国
        - DIRECT
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/AI.png

  - select:
      name: Telegram
      policies: &svc-nodirect
        - 节点选择
        - 自动选择
        - 🇭🇰 香港
        - 🇯🇵 日本
        - 🇸🇬 新加坡
        - 🇺🇸 美国
        - 🇩🇪 德国
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Telegram.png

  - select:
      name: X
      policies: *svc-nodirect
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/X.png

  - select:
      name: TikTok
      policies: *svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/TikTok.png

  - select:
      name: Emby
      policies: *svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Emby.png

  - select:
      name: 国外媒体
      policies:
        - 节点选择
        - 自动选择
        - 兜底后备策略
        - 🇭🇰 香港
        - 🇯🇵 日本
        - 🇸🇬 新加坡
        - 🇺🇸 美国
        - 🇩🇪 德国
        - 全球手动策略
        - DIRECT
      icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png

  - select:
      name: Netflix
      policies: *svc
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png

  - select:
      name: Google
      policies: *svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Google_Search.png

  - select:
      name: 微软服务
      policies:
        - DIRECT
        - 节点选择
        - 自动选择
        - 🇭🇰 香港
        - 🇯🇵 日本
        - 🇸🇬 新加坡
        - 🇺🇸 美国
        - 🇩🇪 德国
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Microsoft.png

  - select:
      name: 苹果服务
      policies:
        - DIRECT
        - 节点选择
        - 自动选择
        - 🇭🇰 香港
        - 🇯🇵 日本
        - 🇸🇬 新加坡
        - 🇺🇸 美国
        - 🇩🇪 德国
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Apple_1.png

  - select:
      name: 国内金融
      policies:
        - DIRECT
        - 节点选择
        - 自动选择
        - 🇭🇰 香港
        - 🇯🇵 日本
        - 🇸🇬 新加坡
        - 🇺🇸 美国
      icon: https://cdn.jsdelivr.net/gh/lige47/QuanX-icon-rule@main/icon/03CNSoft/alipay.png

  - select:
      name: 国际支付
      policies: *svc
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/PayPal.png

  - select:
      name: 国际券商
      policies: *svc
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

  - select:
      name: 数字资产
      policies: *svc
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Cryptocurrency.png

  - select:
      name: Speedtest
      policies:
        - DIRECT
        - 节点选择
        - 自动选择
        - 兜底后备策略
        - 全球手动策略
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Speedtest.png

  # PT 站点：按要求包含 日本 / 新加坡 / 美国 / 香港 节点选择
  - select:
      name: PT站点
      policies:
        - DIRECT
        - 节点选择
        - 自动选择
        - 🇭🇰 香港
        - 🇯🇵 日本
        - 🇸🇬 新加坡
        - 🇺🇸 美国
      icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/NAS(2).png

  # ==================== 国家/地区策略组（仅保留手动选择，去掉重复的 Auto 分组）====================
  - select:
      name: 🇭🇰 香港
      policies:
        - 订阅节点
      flatten: true
      filter: '(?i)(?:🇭🇰|香港|Hong[\s_-]*Kong|(?:^|[^A-Za-z])(?:HK|HKG)[0-9]*(?:$|[^A-Za-z]))'
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Hong_Kong.png

  - select:
      name: 🇯🇵 日本
      policies:
        - 订阅节点
      flatten: true
      filter: '(?i)(?:🇯🇵|日本|Japan|(?:^|[^A-Za-z])(?:JP|JPN)[0-9]*(?:$|[^A-Za-z]))'
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Japan.png

  - select:
      name: 🇸🇬 新加坡
      policies:
        - 订阅节点
      flatten: true
      filter: '(?i)(?:🇸🇬|新加坡|狮城|獅城|Singapore|(?:^|[^A-Za-z])(?:SG|SGP)[0-9]*(?:$|[^A-Za-z]))'
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Singapore.png

  - select:
      name: 🇺🇸 美国
      policies:
        - 订阅节点
      flatten: true
      filter: '(?i)(?:🇺🇸|美国|美國|United[\s_-]*States|(?:^|[^A-Za-z])(?:US|USA)[0-9]*(?:$|[^A-Za-z]))'
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/United_States.png

  - select:
      name: 🇩🇪 德国
      policies:
        - 订阅节点
      flatten: true
      filter: '(?i)(?:🇩🇪|德国|德國|Germany|Deutschland|(?:^|[^A-Za-z])(?:DE|DEU)[0-9]*(?:$|[^A-Za-z]))'
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Germany.png

rules:
  # 个人定制优先：Egern 按配置顺序匹配
  - domain:
      match: time.apple.com
      policy: DIRECT
  - domain:
      match: time.windows.com
      policy: DIRECT
  - domain:
      match: time.google.com
      policy: DIRECT
  - domain:
      match: time.nist.gov
      policy: DIRECT
  - domain:
      match: ntp.aliyun.com
      policy: DIRECT
  - domain_suffix:
      match: pool.ntp.org
      policy: DIRECT
  - domain:
      match: keba.host
      policy: DIRECT
  - domain_suffix:
      match: longemby.live
      policy: Emby
  - domain:
      match: cf.longemby.com
      policy: Emby
  - domain:
      match: cfcdn.longemby.com
      policy: Emby
  - domain_suffix:
      match: longemby.top
      policy: DIRECT
  - domain_suffix:
      match: longemby.com
      policy: DIRECT
  - domain_suffix:
      match: apple-relay.apple.com
      policy: 苹果服务
  - domain_suffix:
      match: apple-relay.cloudflare.com
      policy: 苹果服务
  - domain_suffix:
      match: grok.com
      policy: AI
  - domain_suffix:
      match: alipay.com
      policy: 国内金融
  - domain_suffix:
      match: tenpay.com
      policy: 国内金融
  - domain_suffix:
      match: unionpay.com
      policy: 国内金融
  - domain_suffix:
      match: cmbchina.com
      policy: 国内金融
  - domain_suffix:
      match: icbc.com.cn
      policy: 国内金融
  - domain_suffix:
      match: abchina.com
      policy: 国内金融
  - domain_suffix:
      match: boc.cn
      policy: 国内金融
  - domain_suffix:
      match: ccb.com
      policy: 国内金融
  - domain_suffix:
      match: bankcomm.com
      policy: 国内金融
  - domain_suffix:
      match: psbc.com
      policy: 国内金融
  - domain_suffix:
      match: pingan.com
      policy: 国内金融
  - domain_suffix:
      match: eastmoney.com
      policy: 国内金融

  # PT 与局域网
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/PrivateTracker/PrivateTracker.yaml
      policy: PT站点
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/lan.yaml
      policy: DIRECT
      update_interval: 86400

  # 具体业务优先于通用规则
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/ai.yaml
      policy: AI
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/PayPal/PayPal.yaml
      policy: 国际支付
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/VISA/VISA.yaml
      policy: 国际支付
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Stripe/Stripe.yaml
      policy: 国际支付
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/schwab.yaml
      policy: 国际券商
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/brokerage.yaml
      policy: 国际券商
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/crypto.yaml
      policy: 数字资产
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Netflix/Netflix.yaml
      policy: Netflix
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/youtube.yaml
      policy: 国外媒体
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/tiktok.yaml
      policy: TikTok
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/emby.yaml
      policy: Emby
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/gaming.yaml
      policy: 节点选择
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/telegram.yaml
      policy: Telegram
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/telegram-ip.yaml
      policy: Telegram
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/social.yaml
      policy: X
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Speedtest/Speedtest.yaml
      policy: Speedtest
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/GitHub/GitHub.yaml
      policy: 节点选择
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/developer.yaml
      policy: 节点选择
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/google.yaml
      policy: Google
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/microsoft.yaml
      policy: 微软服务
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/apple.yaml
      policy: 苹果服务
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/apple-cn.yaml
      policy: 苹果服务
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/brokerage-ip.yaml
      policy: 国际券商
      update_interval: 86400
  # 国内应用直连；具体业务规则（如 TikTok）已在前面匹配
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/WeChat/WeChat.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/NetEaseMusic/NetEaseMusic.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/BiliBili/BiliBili.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/Weibo/Weibo.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/EgernRules/X/Rules/XiaoHongShu/XiaoHongShu.yaml
      policy: DIRECT
      update_interval: 86400
  # 国内与通用兜底
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/china.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/proxy.yaml
      policy: 节点选择
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/cn-ip.yaml
      policy: DIRECT
      update_interval: 86400
  - geoip:
      match: CN
      policy: DIRECT
  - default:
      policy: 节点选择

# Lane + 个人策略 | Egern 模板
# Date: 2026-09-12
# 规则分层来自 Lane Egern 发行版；策略组对齐 Surge / Loon / Stash / Shadowrocket 模板。
# 使用前：将「我的节点」urls 换成你的订阅地址。不要填写自建节点明文。
# 无落地线路组；地区仅按节点名过滤。

ipv6: false
allow_external_connections: false
real_ip_domains:
  - '*.stun.*.*'
  - '*.stun.*.*.*'
  - '*.stun.*.*.*.*'
  - '*.stun.*.*.*.*.*'
  - '*.n.n.srv.nintendo.net'
  - '*.stun.playstation.net'
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  - '*.msftncsi.com'
  - '*.msftconnecttest.com'
  - '*.lan'
  - '*.local'
hijack_dns:
  - 8.8.8.8:53
  - 8.8.4.4:53
vif_excluded_routes:
  - 224.0.0.0/4
  - 239.255.255.250/32
  - ff02::fb/128
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
dns:
  bootstrap:
    - system
  forward:
    - wildcard:
        match: '*'
        value: bootstrap

policy_groups:
  - select:
      name: 我的节点
      urls:
        - https://YOUR_SUBSCRIPTION_URL
        # 多订阅取消下一行注释：
        # - https://YOUR_SUBSCRIPTION_URL_2
      update_interval: 86400
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Rocket.png

  - select:
      name: 自动选择
      policies:
        - 我的节点
      flatten: true
      filter: (?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|expire|traffic)).+
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

  - select:
      name: Proxy
      policies:
        - 自动选择
        - 我的节点
        - US Auto
        - US Manual
        - JP Auto
        - JP Manual
        - HK Auto
        - HK Manual
        - TW Auto
        - TW Manual
        - SG Auto
        - SG Manual
        - KR Auto
        - KR Manual
        - GB Auto
        - GB Manual
        - DE Auto
        - DE Manual
        - DIRECT
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Proxy.png

  - select:
      name: AI
      policies: &lane-svc
        - Proxy
        - 自动选择
        - DIRECT
        - US Auto
        - US Manual
        - JP Auto
        - JP Manual
        - HK Auto
        - HK Manual
        - TW Auto
        - TW Manual
        - SG Auto
        - SG Manual
        - KR Auto
        - KR Manual
        - GB Auto
        - GB Manual
        - DE Auto
        - DE Manual
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/AI.png

  - select:
      name: Brokerage
      policies:
        - DIRECT
        - Proxy
        - 自动选择
        - US Auto
        - US Manual
        - JP Auto
        - JP Manual
        - HK Auto
        - HK Manual
        - TW Auto
        - TW Manual
        - SG Auto
        - SG Manual
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Magic.png

  - select:
      name: Crypto
      policies: *lane-svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Cryptocurrency_3.png

  - select:
      name: YouTube
      policies: *lane-svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/YouTube.png

  - select:
      name: TikTok
      policies: *lane-svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/TikTok.png

  - select:
      name: Emby
      policies: *lane-svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Emby.png

  - select:
      name: Streaming
      policies: *lane-svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Netflix.png

  - select:
      name: Gaming
      policies: *lane-svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Steam.png

  - select:
      name: Telegram
      policies:
        - Proxy
        - 自动选择
        - US Auto
        - US Manual
        - JP Auto
        - JP Manual
        - HK Auto
        - HK Manual
        - TW Auto
        - TW Manual
        - SG Auto
        - SG Manual
        - KR Auto
        - KR Manual
        - GB Auto
        - GB Manual
        - DE Auto
        - DE Manual
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Telegram.png

  - select:
      name: Social
      policies:
        - Proxy
        - 自动选择
        - US Auto
        - US Manual
        - JP Auto
        - JP Manual
        - HK Auto
        - HK Manual
        - TW Auto
        - TW Manual
        - SG Auto
        - SG Manual
        - KR Auto
        - KR Manual
        - GB Auto
        - GB Manual
        - DE Auto
        - DE Manual
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/X.png

  - select:
      name: Developer
      policies: *lane-svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/GitHub.png

  - select:
      name: Google
      policies: *lane-svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Google_Search.png

  - select:
      name: Microsoft
      policies:
        - DIRECT
        - Proxy
        - 自动选择
        - US Auto
        - US Manual
        - JP Auto
        - JP Manual
        - HK Auto
        - HK Manual
        - TW Auto
        - TW Manual
        - SG Auto
        - SG Manual
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Microsoft.png

  - select:
      name: Apple
      policies:
        - DIRECT
        - Proxy
        - 自动选择
        - US Auto
        - US Manual
        - JP Auto
        - JP Manual
        - HK Auto
        - HK Manual
        - TW Auto
        - TW Manual
        - SG Auto
        - SG Manual
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Apple_1.png

  - select:
      name: Final
      policies: *lane-svc
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Global.png

  - auto_test:
      name: US Auto
      policies:
        - 我的节点
      flatten: true
      filter: (?i)^.*(?:(?:🇺🇸|美国|United\s*States|(?:^|[^A-Za-z])(?:US|USA)(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
      interval: 600
      tolerance: 50
      timeout: 5
      icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/United_States.png
  - select:
      name: US Manual
      policies:

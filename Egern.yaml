rules:
  # 个人高优先级域名（与 Surge / Loon 模板一致）
  - domain_suffix:
      match: gtimg.cn
      policy: DIRECT
  - domain_suffix:
      match: myqcloud.com
      policy: DIRECT
  - domain:
      match: time.apple.com
      policy: DIRECT
  - domain:
      match: time.windows.com
      policy: DIRECT
  - domain:
      match: time.google.com
      policy: DIRECT
  - domain:
      match: keba.host
      policy: DIRECT
  - domain_suffix:
      match: longemby.live
      policy: Emby
  - domain:
      match: cf.longemby.com
      policy: Emby
  - domain:
      match: cfcdn.longemby.com
      policy: Emby
  - domain_suffix:
      match: longemby.top
      policy: DIRECT
  - domain_suffix:
      match: longemby.com
      policy: DIRECT
  - domain_suffix:
      match: apple-relay.apple.com
      policy: Apple
  - domain_suffix:
      match: apple-relay.cloudflare.com
      policy: Apple
  - domain_suffix:
      match: grok.com
      policy: AI
  - domain_suffix:
      match: alipay.com
      policy: DIRECT
  - domain_suffix:
      match: tenpay.com
      policy: DIRECT
  - domain_suffix:
      match: unionpay.com
      policy: DIRECT

  # Lane 分层
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/lan.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/apple-cn.yaml
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/wenjinliuu/Lane/main/dist/egern/rules/ai.yaml
      policy: AI
      update_interval: 86400
  - rule_set:

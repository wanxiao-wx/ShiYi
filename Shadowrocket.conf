# ShiYi 个人配置和策略 | Shadowrocket
# 本配置为 ShiYi 个人整理与分享，仅供参考，请勿用于商业用途。
# 已对齐 Surge 模板：原版依赖内置 PROXY 分组（未显式定义），现改为显式的
# 节点选择 / 自动选择 / 自建节点 / 订阅节点 四件套，新增 PT站点 策略组（含香港/日本/新加坡/美国节点选择），
# 并精简业务策略组数量。
# 已去掉 Lane 的 update-url，避免远程整份配置覆盖本地修改。
# 使用前：订阅请在 App「订阅」中添加自己的地址（与 Surge/Loon 同一链接）；地区组靠 policy-regex-filter 自动纳入。
# [Proxy] 自建节点请自行填写；订阅请在 App 内添加。

[General]
ipv6 = false
udp-policy-not-supported-behaviour = REJECT
tun-excluded-routes = 224.0.0.0/4, 239.255.255.250/32, ff02::fb/128
always-real-ip = *.stun.*.*, *.stun.*.*.*, *.stun.*.*.*.*, *.stun.*.*.*.*.*, *.n.n.srv.nintendo.net, *.stun.playstation.net, xbox.*.*.microsoft.com, *.*.xboxlive.com, *.msftncsi.com, *.msftconnecttest.com, *.lan, *.local
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5
# 不跟随 Lane 远程整份更新。规则集仍由下方 RULE-SET 独立拉取。

[Proxy]
# 在此填写自建节点，例如：
# 🇺🇸Example = anytls, example.com, 443, password=YOUR_PASSWORD, sni=example.com, udp-relay=true


[Proxy Group]
# ==================== 核心入口（对齐 Surge：节点选择 / 自动选择 / 自建节点 / 订阅节点）====================
节点选择 = select,自动选择,自建节点,订阅节点,DIRECT

自动选择 = url-test,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=(?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|expire|traffic)).+

# Shadowrocket 无法用参数严格区分“仅自建节点”，请在下面追加你在 [Proxy] 中定义的自建节点名称
# 例如：自建节点 = select,DIRECT,🇺🇸Example
自建节点 = select,DIRECT

# 订阅有效节点（需先在 App 添加订阅）
订阅节点 = select,select=0,policy-regex-filter=(?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|expire|traffic)).+

# ==================== 业务策略组（已精简：整合 YouTube/Streaming/Gaming→国外媒体，Social→X，Brokerage/Crypto→金融服务，Developer/Final 并入节点选择）====================
AI = select,节点选择,自动选择,🇭🇰 香港,🇯🇵 日本,🇸🇬 新加坡,🇰🇷 韩国,🇨🇳 台湾,🇺🇸 美国,🇬🇧 英国,🇩🇪 德国,DIRECT,policy-select-name=节点选择
Telegram = select,节点选择,自动选择,🇭🇰 香港,🇯🇵 日本,🇸🇬 新加坡,🇰🇷 韩国,🇨🇳 台湾,🇺🇸 美国,🇬🇧 英国,🇩🇪 德国,policy-select-name=节点选择
X = select,节点选择,自动选择,🇭🇰 香港,🇯🇵 日本,🇸🇬 新加坡,🇰🇷 韩国,🇨🇳 台湾,🇺🇸 美国,🇬🇧 英国,🇩🇪 德国,policy-select-name=节点选择
TikTok = select,节点选择,自动选择,🇭🇰 香港,🇯🇵 日本,🇸🇬 新加坡,🇰🇷 韩国,🇨🇳 台湾,🇺🇸 美国,🇬🇧 英国,🇩🇪 德国,DIRECT,policy-select-name=节点选择
Emby = select,节点选择,自动选择,🇭🇰 香港,🇯🇵 日本,🇸🇬 新加坡,🇰🇷 韩国,🇨🇳 台湾,🇺🇸 美国,🇬🇧 英国,🇩🇪 德国,DIRECT,policy-select-name=节点选择
国外媒体 = select,节点选择,自动选择,🇭🇰 香港,🇯🇵 日本,🇸🇬 新加坡,🇰🇷 韩国,🇨🇳 台湾,🇺🇸 美国,🇬🇧 英国,🇩🇪 德国,DIRECT,policy-select-name=节点选择
Google = select,节点选择,自动选择,🇭🇰 香港,🇯🇵 日本,🇸🇬 新加坡,🇰🇷 韩国,🇨🇳 台湾,🇺🇸 美国,🇬🇧 英国,🇩🇪 德国,DIRECT,policy-select-name=节点选择
微软服务 = select,DIRECT,节点选择,自动选择,🇭🇰 香港,🇯🇵 日本,🇸🇬 新加坡,🇰🇷 韩国,🇨🇳 台湾,🇺🇸 美国,🇬🇧 英国,🇩🇪 德国,policy-select-name=DIRECT
苹果服务 = select,DIRECT,节点选择,自动选择,🇭🇰 香港,🇯🇵 日本,🇸🇬 新加坡,🇰🇷 韩国,🇨🇳 台湾,🇺🇸 美国,🇬🇧 英国,🇩🇪 德国,policy-select-name=DIRECT
金融服务 = select,DIRECT,节点选择,自动选择,🇭🇰 香港,🇯🇵 日本,🇸🇬 新加坡,🇺🇸 美国,policy-select-name=DIRECT

# PT 站点：按要求包含 日本 / 新加坡 / 美国 / 香港 节点选择
PT站点 = select,DIRECT,节点选择,自动选择,🇭🇰 香港,🇯🇵 日本,🇸🇬 新加坡,🇺🇸 美国,policy-select-name=DIRECT

# ==================== 国家/地区策略组（仅保留手动选择，去掉重复的 Auto 分组）====================
🇭🇰 香港 = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇭🇰|香港|Hong\s*Kong|(?:^|[^A-Za-z])HK(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
🇯🇵 日本 = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇯🇵|日本|Japan|(?:^|[^A-Za-z])JP(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
🇸🇬 新加坡 = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇸🇬|新加坡|狮|獅|Singapore|(?:^|[^A-Za-z])SG(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
🇰🇷 韩国 = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇰🇷|韩国|韓國|Korea|(?:^|[^A-Za-z])KR(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
🇨🇳 台湾 = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇹🇼|台湾|臺灣|Taiwan|(?:^|[^A-Za-z])TW(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
🇺🇸 美国 = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇺🇸|美国|United\s*States|(?:^|[^A-Za-z])(?:US|USA)(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
🇬🇧 英国 = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇬🇧|英国|英國|United\s*Kingdom|(?:^|[^A-Za-z])(?:UK|GB)(?:[0-9]+)?(?:$|[^A-Za-z]))).*$
🇩🇪 德国 = select,select=0,policy-regex-filter=(?i)^.*(?:(?:🇩🇪|德国|德國|Germany|(?:^|[^A-Za-z])DE(?:[0-9]+)?(?:$|[^A-Za-z]))).*$


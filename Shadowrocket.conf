# Lane + 个人策略 | Shadowrocket
# Date: 2026-09-12
# 规则分层来自 Lane；策略组对齐 Surge / Loon。
# 自建节点沿用 Loon 已有 AnyTLS，不从 Surge 增补 Snell。
# 已去掉 Lane 的 update-url，避免远程整份配置覆盖本地修改。
# 订阅请在 App「订阅」中添加（与 Surge/Loon 同一链接）；地区组靠 policy-regex-filter 自动纳入。
# 模板：填写 [Proxy] 自建节点；订阅请在 App 内添加。

[General]
ipv6 = false
udp-policy-not-supported-behaviour = REJECT
tun-excluded-routes = 224.0.0.0/4, 239.255.255.250/32, ff02::fb/128
always-real-ip = *.stun.*.*, *.stun.*.*.*, *.stun.*.*.*.*, *.stun.*.*.*.*.*, *.n.n.srv.nintendo.net, *.stun.playstation.net, xbox.*.*.microsoft.com, *.*.xboxlive.com, *.msftncsi.com, *.msftconnecttest.com, *.lan, *.local
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5
# 不跟随 Lane 远程整份更新。规则集仍由下方 RULE-SET 独立拉取。

[Proxy]
# 在此填写自建节点，例如：
# 🇺🇸Example = anytls, example.com, 443, password=YOUR_PASSWORD, sni=example.com, udp-relay=true


# Shadowrocket 首页选中的节点即内置 PROXY，服务组默认跟随 PROXY。
[Proxy Group]
# 自建手动入口（对应 Surge/Loon「自建节点」）
自建节点 = select,DIRECT
# 订阅有效节点（需先在 App 添加订阅）
订阅节点 = select,select=0,policy-regex-filter=(?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|expire|traffic)).+

AI = select,PROXY,自动选择,DIRECT,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,KR Auto,KR Manual,GB Auto,GB Manual,DE Auto,DE Manual,policy-select-name=PROXY
Brokerage = select,DIRECT,PROXY,自动选择,US Auto,US Manual,JP Auto,JP Manual,HK Auto,HK Manual,TW Auto,TW Manual,SG Auto,SG Manual,policy-select-name=DIRECT

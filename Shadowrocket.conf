# ShiYi 个人配置和策略 | Shadowrocket
# 本配置为 ShiYi 个人整理与分享，仅供参考，请勿用于商业用途。
# 按业务策略与规则顺序分流；地区组筛选节点名称。
# 已去掉 Lane 的 update-url，避免远程整份配置覆盖本地修改。
# 使用前：订阅请在 App「订阅」中添加自己的地址（与 Surge/Loon 同一链接）；地区组靠 policy-regex-filter 自动纳入。
# [Proxy] 自建节点请自行填写；订阅请在 App 内添加。

[General]
ipv6 = false
udp-policy-not-supported-behaviour = REJECT
tun-excluded-routes = 224.0.0.0/4, ff02::fb/128
always-real-ip = *.stun.*.*, *.stun.*.*.*, *.stun.*.*.*.*, *.stun.*.*.*.*.*, *.n.n.srv.nintendo.net, *.stun.playstation.net, xbox.*.*.microsoft.com, *.*.xboxlive.com, *.msftncsi.com, *.msftconnecttest.com, *.lan, *.local
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5
# 不跟随 Lane 远程整份更新。规则集仍由下方 RULE-SET 独立拉取。

[Proxy]
# 在此填写自建节点，例如：
# 🇺🇸Example = anytls, example.com, 443, password=YOUR_PASSWORD, sni=example.com, udp-relay=true


[Proxy Group]
# ==================== 核心入口（对齐 Surge：节点选择 / 自动选择 / 自建节点 / 订阅节点）====================
节点选择 = select,自动选择,兜底后备策略,自建节点,订阅节点,全球手动策略,DIRECT

自动选择 = url-test,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=(?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|回国|游戏|维护|game|expire|traffic)).+
兜底后备策略 = fallback,url=http://cp.cloudflare.com/generate_204,interval=600,timeout=5,select=0,policy-regex-filter=(?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|回国|游戏|维护|game|expire|traffic)).+
全球手动策略 = select,select=0,policy-regex-filter=(?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|回国|游戏|维护|game|expire|traffic)).+

# Shadowrocket 无法用参数严格区分“仅自建节点”，请在下面追加你在 [Proxy] 中定义的自建节点名称
# 例如：自建节点 = select,DIRECT,🇺🇸Example
自建节点 = select,DIRECT

# 订阅有效节点（需先在 App 添加订阅）
订阅节点 = select,select=0,policy-regex-filter=(?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|回国|游戏|维护|game|expire|traffic)).+


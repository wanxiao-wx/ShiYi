自动选择 = url-test,url=http://cp.cloudflare.com/generate_204,interval=600,tolerance=50,timeout=5,select=0,policy-regex-filter=(?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|expire|traffic)).+


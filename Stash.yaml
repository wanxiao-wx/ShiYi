# Lane + 个人策略 | Stash
# Date: 2026-09-12
# 规则集与分层来自 Lane Stash 发行版；策略组对齐 Surge / Loon。
# 自建节点沿用 Loon 已有 AnyTLS，不从 Surge 增补 Snell。
# 模板：填写 proxies 自建节点，并将 proxy-providers.订阅.url 换成你的订阅地址。

mode: rule
log-level: warning
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-filter:
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - '*.n.n.srv.nintendo.net'
    - +.stun.playstation.net
    - xbox.*.*.microsoft.com
    - '*.*.xboxlive.com'
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'
    - '*.lan'
    - '*.local'

proxies: []
# 自建节点示例：
# proxies:
#   - name: Example
#     type: anytls
#     server: example.com
#     port: 443
#     password: YOUR_PASSWORD
#     sni: example.com
#     udp: true


proxy-providers:
  订阅:
    url: https://YOUR_SUBSCRIPTION_URL
    interval: 86400
    benchmark-url: http://cp.cloudflare.com/generate_204
    benchmark-timeout: 5
  # 多订阅时复制整块、名称递增即可；我的节点 / 地区组用 include-all，不必改策略组。

proxy-groups:
  - name: 自建节点
    type: select
    include-all: true
    filter: (?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|expire|traffic)).+
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Daily.png

  - name: 我的节点
    type: select
    include-all: true
    filter: (?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|expire|traffic)).+
    icon: https://raw.githubusercontent.com/wenjinliuu/Lane/main/assets/icons/third-party/qure/Rocket.png

  - name: 自动选择
    type: url-test
    include-all: true
    filter: (?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|expire|traffic)).+
    interval: 600
    tolerance: 50
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

  - name: 兜底后备策略
    type: fallback
    include-all: true
    filter: (?i)^(?!.*(?:剩余流量|套餐到期|官网|机场|过期|expire|traffic)).+
    interval: 600
    lazy: true
    icon: https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/fallback.png

  # 对应 Surge「节点选择」/ Lane「Proxy」
  - name: Proxy
    type: select
    proxies:
      - 自动选择
      - 兜底后备策略
      - 自建节点
      - 我的节点
      - US Auto
      - US Manual
      - JP Auto
      - JP Manual
      - HK Auto
      - HK Manual
      - TW Auto
      - TW Manual
      - SG Auto
      - SG Manual
      - KR Auto

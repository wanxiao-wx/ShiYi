# ShiYi 个人配置和策略 | Stash
# 本配置为 ShiYi 个人整理与分享，仅供参考，请勿用于商业用途。
# 按 Stash 顺序匹配规则；业务策略与 Loon 配置保持相近。
# 使用前替换订阅 URL；添加自建节点后，需把节点名称加入「自建节点」，
# 如需参与测速，还需加入「自动选择」和「兜底后备策略」。

mode: rule
log-level: warning
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  nameserver:
    - system
    - 223.5.5.5
  fake-ip-filter:
    - +.stun.*.*
    - +.stun.*.*.*
    - +.stun.*.*.*.*
    - +.stun.*.*.*.*.*
    - '*.n.n.srv.nintendo.net'
    - +.stun.playstation.net
    - xbox.*.*.microsoft.com
    - '*.*.xboxlive.com'
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'
    - '*.lan'
    - '*.local'


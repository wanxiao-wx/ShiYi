[Remote Filter]
# NameRegex 必须指向订阅名「订阅」
香港节点 = NameRegex,订阅, FilterKey = "(?i)(?:^🇭🇰|香港|Hong(?:[\s_-]*Kong)?|(?:^|[-_/|\s])HK(?:G)?(?:[-_/|\s]|$))"
日本节点 = NameRegex,订阅, FilterKey = "(?i)(?:^🇯🇵|日本|Japan|(?:^|[-_/|\s])JP(?:N)?(?:[-_/|\s]|$))"
新加坡节点 = NameRegex,订阅, FilterKey = "(?i)(?:^🇸🇬|新加坡|狮城|Singapore|(?:^|[-_/|\s])SG(?:P)?(?:[-_/|\s]|$))"
美国节点 = NameRegex,订阅, FilterKey = "(?i)(?:^🇺🇸|美国|美國|United[\s_-]*States|(?:^|[-_/|\s])US(?:A)?(?:[-_/|\s]|$))"
德国节点 = NameRegex,订阅, FilterKey = "(?i)(?:^🇩🇪|德国|德國|Germany|Deutschland|(?:^|[-_/|\s])DE(?:U)?(?:[-_/|\s]|$))"
全球节点 = NameRegex,订阅, FilterKey = "(?i)^(?!.*(?:群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|回国|游戏|维护|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|好友|剩余流量|套餐到期|USE|USED|TOTAL|EXPIRE|EMAIL|PANEL|CHANNEL|AUTHOR|TRAFFIC)).+"

